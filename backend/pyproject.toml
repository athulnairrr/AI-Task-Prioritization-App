[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the AI Work Planner"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "asyncpg==0.31.0",
    "pyjwt[crypto]==2.13.0",
    "google-genai==2.19.0",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "httpx==0.28.1",
    "ruff==0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
