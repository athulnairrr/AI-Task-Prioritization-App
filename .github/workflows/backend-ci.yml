name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI-only dummy secrets for hermetic unit tests (not real credentials;
      # tests requiring a live database/Gemini/Google key are skipped, not run).
      OAUTH_STATE_SECRET: ci-test-oauth-state-secret-not-for-production-use
      TOKEN_ENCRYPTION_KEY: feIgjWVuQT2mNs_H6e5Qz6ecQ8gXrcShJYhYwZcZhsQ=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
